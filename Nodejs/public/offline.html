<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Tutorly</title>
    <style>
        /* Inlined, not loaded from Tailwind (CDN or local build) - this is the
           page the service worker shows when there's no network at all, so it
           can't depend on fetching any stylesheet either. */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0a0a0a;
            color: #fafafa;
            font-family: ui-sans-serif, system-ui, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1.5rem;
        }
        .card {
            background: #141414;
            padding: 2rem;
            border-radius: 0.75rem;
            border: 1px solid #262626;
            max-width: 28rem;
            width: 100%;
        }
        .card svg { width: 4rem; height: 4rem; margin: 0 auto 1rem; display: block; }
        .card h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
        .card p { margin-bottom: 1.5rem; }
        .card button {
            background: #fafafa;
            color: #0a0a0a;
            font: inherit;
            font-weight: 500;
            padding: 0.5rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .card button:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="card">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
        </svg>
        <h1>You are offline</h1>
        <p>It seems you lost your internet connection. Check your network and try again.</p>
        <button onclick="window.location.reload()">
            Retry Connection
        </button>
    </div>
</body>
</html>
