# Test-only configuration, loaded by every test (overrides the gitignored
# src/main/resources/application.properties, which points at the real
# Postgres instance - that file is for running the app, not for tests).
#
# BackendApiApplicationTests (@SpringBootTest, full context) is the only test
# that needs a datasource/EntityManagerFactory at all - every other test
# mocks the repository layer with Mockito and never touches this. It just
# needs to boot successfully, not persist anything meaningful, so an
# in-memory H2 instance is enough and keeps `mvn test` from depending on a
# real database being up on whatever machine it runs on.
# NON_KEYWORDS=DAY un-reserves "day" so Hibernate can create the Test entity's
# `day` column - it's a plain column name in Postgres, but a reserved word in
# H2's own grammar (used for INTERVAL ... DAY).
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=DAY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Required by ApiKeyInterceptor (@Value, no default) - any non-empty value
# works, no test actually exercises API-key checking against this context.
api.security.keys=test-api-key
